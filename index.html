<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Playback</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

#controls {
  padding:10px;
  background:#eee;
}

#map {
  height:500px;
}
</style>
</head>

<body>

<div id="controls">
<label>Day:</label>
<select id="daySelect"></select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP SETUP
let map = L.map('map').setView([53.5, -105.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// LAYER
let routeLayer = L.layerGroup().addTo(map);

// DATA (you can replace later)
let data = {
  days: {
    "2026-01-01": [
      {lat: 53.212, lng: -105.743, time: new Date()},
      {lat: 53.230, lng: -105.700, time: new Date()},
      {lat: 53.250, lng: -105.640, time: new Date()}
    ]
  }
};

// ADDRESS FUNCTION
async function getAddress(lat, lng){
  try {
    let r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    let data = await r.json();
    return data.display_name || "Address unavailable";
  } catch(e){
    return "Address unavailable";
  }
}

// DROPDOWN
let daySelect = document.getElementById("daySelect");

Object.keys(data.days).forEach(day => {
  let opt = document.createElement("option");
  opt.value = day;
  opt.text = day;
  daySelect.appendChild(opt);
});

// LOAD DAY
function loadDay(day){

  routeLayer.clearLayers();

  let points = data.days[day];
  if(!points) return;

  let latlngs = points.map(p => [p.lat, p.lng]);

  let route = L.polyline(latlngs, {color:"blue"}).addTo(routeLayer);

  points.forEach(p => {

    let marker = L.circleMarker([p.lat, p.lng], {
      radius:6,
      color:"orange"
    }).addTo(routeLayer);

    getAddress(p.lat, p.lng).then(addr => {
      marker.bindPopup(
        "Stop<br>" +
        p.time.toLocaleTimeString() + "<br>" +
        addr
      );
    });

  });

  map.fitBounds(route.getBounds());
}

// EVENT
daySelect.onchange = () => loadDay(daySelect.value);

// START
loadDay(Object.keys(data.days)[0]);

</script>

</body>
</html>

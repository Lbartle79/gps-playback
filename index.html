<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Stops Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body { margin:0; }
    #map { height:100vh; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([52.8599, -104.6010], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ✅ YOUR FULL STOPS WITH ADDRESSES
var stops = [
  {lat:52.866673, lng:-104.594767, addr:"McLeod Ave & Main St"},
  {lat:52.860067, lng:-104.612083, addr:"Burrows Ave area"},
  {lat:52.860062, lng:-104.600967, addr:"Downtown Melfort"},
  {lat:52.860195, lng:-104.602300, addr:"Near Post Office"},
  {lat:52.855452, lng:-104.590250, addr:"South Melfort residential"},
  {lat:52.851177, lng:-104.586283, addr:"Near golf course"}
];

// 🔵 Draw markers with addresses
var bounds = [];

stops.forEach((p, i) => {
  L.circleMarker([p.lat, p.lng], {
    radius: 6,
    color: "orange"
  }).addTo(map)
  .bindPopup("<b>Stop " + (i+1) + "</b><br>" + p.addr);

  bounds.push([p.lat, p.lng]);
});

// 🔍 Auto zoom
map.fitBounds(bounds);

</script>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Playback</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial, sans-serif; }
#controls { padding:10px; background:#f0f0f0; }
#map { height:60vh; width:100%; }
#log { padding:10px; }
button { margin-left:5px; }
</style>
</head>
<body>

<div id="controls">
Day:
<select id="daySelect"></select>
<button onclick="startPlayback()">Play</button>
<button onclick="pausePlayback()">Pause</button>
<button onclick="resetPlayback()">Reset</button>
Speed:
<input type="range" id="speed" min="200" max="2000" value="800">
</div>

<div id="map"></div>
<div id="log"></div>

<script>

const TIMEZONE = "America/Regina";

let map = L.map('map').setView([53, -105], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

let marker = L.marker([53, -105]).addTo(map);
let polyline = L.polyline([], { color: 'blue' }).addTo(map);

let groupedData = {};
let currentDayData = [];
let playbackIndex = 0;
let timer = null;

function formatTime(dateStr) {
    return new Date(dateStr).toLocaleString("en-CA", {
        timeZone: TIMEZONE,
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
    });
}

function formatDuration(start, end) {
    let diff = (new Date(end) - new Date(start)) / 60000;
    let h = Math.floor(diff / 60);
    let m = Math.floor(diff % 60);
    return h + "h " + m + "m";
}

function groupByDay(data) {
    let grouped = {};
    data.forEach(entry => {
        if (!entry.startTime) return;
        let date = new Date(entry.startTime)
            .toLocaleDateString("en-CA", { timeZone: TIMEZONE });

        if (!grouped[date]) grouped[date] = [];
        grouped[date].push(entry);
    });
    return grouped;
}

function moveMarker(entry) {

    let lat = null;
    let lng = null;

    if (entry.activity && entry.activity.end) {
        let coords = entry.activity.end.replace("geo:", "").split(",");
        lat = parseFloat(coords[0]);
        lng = parseFloat(coords[1]);
    }

    if (entry.visit && entry.visit.point) {
        let coords = entry.visit.point.replace("geo:", "").split(",");
        lat = parseFloat(coords[0]);
        lng = parseFloat(coords[1]);
    }

    if (lat !== null && lng !== null) {
        marker.setLatLng([lat, lng]);
        map.setView([lat, lng], 12);
        polyline.addLatLng([lat, lng]);
    }
}

function playStep() {
    if (playbackIndex >= currentDayData.length) {
        pausePlayback();
        return;
    }

    moveMarker(currentDayData[playbackIndex]);
    playbackIndex++;
}

function startPlayback() {
    if (timer) return;
    let speed = document.getElementById("speed").value;
    timer = setInterval(playStep, speed);
}

function pausePlayback() {
    clearInterval(timer);
    timer = null;
}

function resetPlayback() {
    pausePlayback();
    playbackIndex = 0;
    polyline.setLatLngs([]);
    document.getElementById("log").innerHTML = "";
}

function showStops(day) {
    let html = "";
    currentDayData.forEach(entry => {
        if (entry.startTime && entry.endTime) {
            html += `
            <div>
                <b>Start:</b> ${formatTime(entry.startTime)}<br>
                <b>End:</b> ${formatTime(entry.endTime)}<br>
                <b>Duration:</b> ${formatDuration(entry.startTime, entry.endTime)}
            </div><hr>`;
        }
    });
    document.getElementById("log").innerHTML = html;
}

function loadDay(day) {
    pausePlayback();
    playbackIndex = 0;
    polyline.setLatLngs([]);

    currentDayData = groupedData[day] || [];

    if (currentDayData.length > 0) {
        moveMarker(currentDayData[0]);
        showStops(day);
    }
}

fetch("location-history.json")
    .then(response => response.json())
    .then(data => {

        groupedData = groupByDay(data);

        let select = document.getElementById("daySelect");

        Object.keys(groupedData)
            .sort()
            .forEach(day => {
                let opt = document.createElement("option");
                opt.value = day;
                opt.textContent = day;
                select.appendChild(opt);
            });

        select.onchange = () => loadDay(select.value);

        if (select.options.length > 0) {
            loadDay(select.value);
        }
    })
    .catch(err => {
        document.getElementById("log").innerHTML =
            "Error loading JSON file.";
        console.error(err);
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FULL GPS MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// 🔥 PASTE YOUR FULL TEXT DATA HERE
const raw = `PASTE YOUR ENTIRE TEXT FILE HERE`;

// MAP
var map = L.map('map',{maxZoom:22}).setView([52.8599,-104.6010],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22
}).addTo(map);

// EXTRACT EVERYTHING (no missing)
let regex = /Latitude:\s*(-?\d+\.\d+)\s*Longitude:\s*(-?\d+\.\d+)/g;

let match;
let count = 0;

while((match = regex.exec(raw)) !== null){

  let lat = parseFloat(match[1]);
  let lng = parseFloat(match[2]);

  L.circleMarker([lat,lng],{
    radius:6,
    color:"#0066ff",
    fillColor:"#3399ff",
    fillOpacity:0.9
  }).addTo(map)
  .bindPopup("Stop " + (++count));
}

</script>
</body>
</html>

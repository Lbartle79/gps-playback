<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Full GPS Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([52.8599, -104.6010], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

var stops = [];
var bounds = [];

// 🔥 LOAD YOUR REAL FILE
fetch("Vehicle Report 2026-01-01 to 2026-01-01.pdf")
.then(res => res.text())
.then(text => {

  let matches = text.match(/Latitude:\s*(-?\d+\.\d+)\s*Longitude:\s*(-?\d+\.\d+)/g);

  if(!matches){
    alert("No data found");
    return;
  }

  matches.forEach((line, i) => {

    let lat = parseFloat(line.match(/Latitude:\s*(-?\d+\.\d+)/)[1]);
    let lng = parseFloat(line.match(/Longitude:\s*(-?\d+\.\d+)/)[1]);

    L.circleMarker([lat, lng], {
      radius: 4,
      color: "orange"
    }).addTo(map)
    .bindPopup("Stop " + (i+1));

    bounds.push([lat, lng]);

  });

  if(bounds.length > 0){
    map.fitBounds(bounds);
  }

})
.catch(err => {
  console.log(err);
  alert("File not loading — check filename");
});

</script>

</body>
</html>

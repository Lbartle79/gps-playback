<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FULL GPS MAP (ALL DATA - POINTS ONLY)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([52.8599,-104.6010],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22
}).addTo(map);

// LOAD FULL DATA
fetch('data.json')
.then(res => res.json())
.then(data => {

  let bounds = [];

  data.points.forEach((p,i)=>{

    let coords = [p.lat, p.lng];

    L.circleMarker(coords,{
      radius:4,
      color:"#0066ff",
      fillColor:"#3399ff",
      fillOpacity:0.8
    }).addTo(map);

    bounds.push(coords);

  });

  map.fitBounds(bounds);

});

</script>

</body>
</html>

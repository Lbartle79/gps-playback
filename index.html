<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FULL GPS MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map',{maxZoom:22}).setView([52.8599,-104.6010],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:22
}).addTo(map);

// 🔥 LOAD YOUR FILE
fetch('text.txt')
.then(r => r.text())
.then(raw => {

  // 🔥 MUCH STRONGER MATCH (THIS WAS THE ISSUE)
  let matches = raw.match(/-?\d+\.\d+/g);

  if(!matches || matches.length < 2){
    alert("No data found in file");
    return;
  }

  let bounds = [];
  let count = 0;

  for(let i=0; i<matches.length; i+=2){

    let lat = parseFloat(matches[i]);
    let lng = parseFloat(matches[i+1]);

    if(isNaN(lat) || isNaN(lng)) continue;

    let marker = L.circleMarker([lat,lng],{
      radius:6,
      color:"#0066ff",
      fillColor:"#3399ff",
      fillOpacity:0.9
    }).addTo(map);

    marker.bindPopup("Stop " + (++count));

    bounds.push([lat,lng]);
  }

  if(bounds.length > 0){
    map.fitBounds(bounds);
  } else {
    alert("Still no valid coordinates found");
  }

})
.catch(err=>{
  alert("Could not load text.txt file");
  console.error(err);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS MAP (FULL WORKING)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- YOUR DATA FILE -->
<script src="data.js"></script>

<script>

// CREATE MAP
var map = L.map('map').setView([52.8599,-104.6010],14);

// MAP TILES
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22
}).addTo(map);

// SAFETY CHECK
if (typeof stops === "undefined") {
  alert("data.js is not loading!");
}

// DRAW POINTS (NO LINES)
var bounds = [];

stops.forEach((p,i)=>{
  let coords = [p.lat, p.lng];

  L.circleMarker(coords,{
    radius:3,
    color:"#0066ff",
    fillColor:"#3399ff",
    fillOpacity:0.8
  }).addTo(map);

  bounds.push(coords);
});

// AUTO ZOOM
if (bounds.length > 0) {
  map.fitBounds(bounds);
}

</script>

</body>
</html>

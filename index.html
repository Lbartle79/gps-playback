<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>

<script>

var map = L.map('map').setView([52.8599, -104.6010], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let bounds = [];

stops.forEach((p, i) => {

  L.circleMarker([p.lat, p.lng], {
    radius: 5,
    color: "orange"
  }).addTo(map)
  .bindPopup("Stop " + (i+1));

  bounds.push([p.lat, p.lng]);

});

if(bounds.length > 0){
  map.fitBounds(bounds);
}

</script>

</body>
</html>

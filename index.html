<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP SETUP
var map = L.map('map').setView([52.8599,-104.6010],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22
}).addTo(map);

// DATA
var stops = [
[52.859830,-104.601040],
[52.859800,-104.601002],
[52.859902,-104.600983],
[52.859850,-104.601050],
[52.859777,-104.601117],
[52.859905,-104.601027],
[52.859928,-104.601233],
[52.859725,-104.601050],
[52.859873,-104.601015],
[52.859907,-104.601275],
[52.866608,-104.594715],
[52.866677,-104.594717],
[52.866570,-104.594633],
[52.866590,-104.594700],
[52.866650,-104.594667],
[52.866642,-104.594823],
[52.866722,-104.594527],
[52.855452,-104.590250],
[52.853570,-104.590877],
[52.855472,-104.590227],
[52.852535,-104.589483],
[52.861918,-104.608267],
[52.860067,-104.612083],
[52.860195,-104.602300],
[52.860102,-104.601050],
[52.952210,-105.029467],
[53.149060,-105.712683],
[54.431543,-105.794070]
];

// DRAW POINTS
var bounds = [];

stops.forEach(function(p,i){

  var color = "#0066ff";

  if (p[0] > 52.8597 && p[0] < 52.8602 && p[1] < -104.6008 && p[1] > -104.6013) {
    color = "#ff0000";
  }

  if (p[0] > 52.8664 && p[0] < 52.8668) {
    color = "#00cc66";
  }

  L.circleMarker(p,{
    radius:7,
    color:color,
    fillColor:color,
    fillOpacity:0.9
  }).addTo(map)
  .bindPopup("Stop " + (i+1) + "<br>Lat: " + p[0] + "<br>Lng: " + p[1]);

  bounds.push(p);

});

map.fitBounds(bounds);

</script>

</body>
</html>

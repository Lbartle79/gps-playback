<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

#controls {
  padding:10px;
  background:#eee;
}

#map {
  height:500px;
}
</style>
</head>

<body>

<div id="controls">
<label>Day:</label>
<select id="daySelect"></select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Create map
let map = L.map('map').setView([53.5, -105.5], 6);

// Load tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// Layer for routes
let routeLayer = L.layerGroup().addTo(map);

let routeLayer = L.layerGroup().addTo(map);

let data = {
  days: {
    "2026-01-01": [
      {lat:53.212,lng:-105.743,time:new Date()},
      {lat:53.230,lng:-105.700,time:new Date()},
      {lat:53.250,lng:-105.640,time:new Date()}
    ]
  }
};

// Build dropdown
let daySelect = document.getElementById("daySelect");

for(let d in data.days){
  let opt = document.createElement("option");
  opt.value = d;
  opt.text = d;
  daySelect.appendChild(opt);
}

// Load a day
function loadDay(day){

  routeLayer.clearLayers();

  let points = data.days[day];
  if(!points || points.length === 0) return;

  let latlngs = points.map(p => [p.lat, p.lng]);

  let route = L.polyline(latlngs,{color:"blue"}).addTo(routeLayer);

  points.forEach(p=>{
    L.circleMarker([p.lat,p.lng],{
      radius:6,
      color:"orange"
    })
    .addTo(routeLayer)
    .bindPopup("Stop<br>"+p.time.toLocaleTimeString());
  });

  map.fitBounds(route.getBounds());
}

// Dropdown change
daySelect.onchange = () => loadDay(daySelect.value);

// Load first day
loadDay(Object.keys(data.days)[0]);

</script>

</body>
</html>

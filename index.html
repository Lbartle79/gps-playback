<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS MAP (TIMELINE + CLUSTERS)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
body { margin:0; }
#map { height:90vh; }
#controls {
  height:10vh;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}
button {
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>
<body>

<div id="map"></div>
<div id="controls">
  <button onclick="startPlayback()">▶ Play Timeline</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>

var map = L.map('map').setView([52.8599,-104.6010],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22
}).addTo(map);

// CLUSTER GROUP
var cluster = L.markerClusterGroup();
map.addLayer(cluster);

let timelinePoints = [];
let playbackIndex = 0;
let playbackMarker;

// LOAD DATA
fetch('data.json')
.then(res => res.json())
.then(data => {

  // SORT BY TIME
  data.points.sort((a,b)=> new Date(a.time) - new Date(b.time));

  data.points.forEach((p)=>{

    let coords = [p.lat, p.lng];

    // CLUSTER POINT
    let marker = L.circleMarker(coords,{
      radius:4,
      color:"#0066ff",
      fillOpacity:0.7
    }).bindPopup(p.time);

    cluster.addLayer(marker);

    timelinePoints.push(coords);
  });

  map.fitBounds(cluster.getBounds());

});

// PLAYBACK

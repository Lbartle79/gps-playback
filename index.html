}).addTo(map);

let currentIndex = 0;
let timer = null;

let daySelect = document.getElementById("daySelect");

    option.value = day;
    option.text = day;
    daySelect.appendChild(option);
}

function loadDay(day) {
    let points = data.days[day];
    if (!points) return;

    if (marker) map.removeLayer(marker);
    if (polyline) map.removeLayer(polyline);

    let latlngs = points.map(p => [p.lat, p.lon]);
    polyline = L.polyline([], {color: 'blue', weight: 4}).addTo(map);

    marker = L.circleMarker(latlngs[0], {
        radius: 6,
        color: 'red'
    }).addTo(map);

    map.fitBounds(latlngs);

    window.currentPoints = points;

function play() {
    let speed = document.getElementById("speed").value;
    clearInterval(timer);
    timer = setInterval(() => {
        if (currentIndex >= window.currentPoints.length) return;
        polyline.addLatLng(window.currentPoints[currentIndex]);
        marker.setLatLng(window.currentPoints[currentIndex]);
        currentIndex++;
    }, 1000 / speed);
}

function pause() {
    clearInterval(timer);
}

daySelect.addEventListener("change", function() {
    loadDay(this.value);
});

loadDay(daySelect.value);

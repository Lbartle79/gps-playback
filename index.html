<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map',{maxZoom:22}).setView([52.8599,-104.6010],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:22
}).addTo(map);

fetch('text.txt')
.then(r => r.text())
.then(raw => {

  // 🔥 CORRECT MATCH (this is the fix)
  let regex = /Latitude[:\s]*(-?\d+\.\d+)[^\d-]+Longitude[:\s]*(-?\d+\.\d+)/gi;

  let match;
  let bounds = [];
  let count = 0;

  while((match = regex.exec(raw)) !== null){

    let lat = parseFloat(match[1]);
    let lng = parseFloat(match[2]);

    if(lat < -90 || lat > 90) continue;
    if(lng < -180 || lng > 180) continue;

    L.circleMarker([lat,lng],{
      radius:6,
      color:"#0066ff",
      fillColor:"#3399ff",
      fillOpacity:0.9
    }).addTo(map);

    bounds.push([lat,lng]);
    count++;
  }

  if(bounds.length > 0){
    map.fitBounds(bounds);
  } else {
    alert("No valid coordinates found");
  }

})
.catch(err=>{
  alert("Could not load text.txt");
  console.error(err);
});

</script>

</body>
</html>

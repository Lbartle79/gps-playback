
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Stop Playback</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  #controls {
    padding: 15px;
    background: #f4f4f4;
  }

  select, button {
    font-size: 18px;
    padding: 10px;
    margin-right: 10px;
  }

  #map {
    height: 60vh;
  }

  #info {
    padding: 15px;
    font-size: 18px;
    background: #ffffff;
    border-top: 1px solid #ccc;
  }
</style>
</head>

<body>

<div id="controls">
  <label>Select Day:</label>
  <select id="daySelect"></select>
  <button onclick="prevStop()">Previous</button>
  <button onclick="nextStop()">Next</button>
</div>

<div id="map"></div>
<div id="info">No stop selected.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([53.2, -105.75], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let marker = null;
let stopsByDay = {};
let currentStops = [];
let currentIndex = 0;

function formatTime(dateStr) {
  const date = new Date(dateStr);
  return date.toLocaleString(undefined, {
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}

function formatDuration(start, end) {
  const ms = new Date(end) - new Date(start);
  const minutes = Math.floor(ms / 60000);
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  return `${hours}h ${mins}m`;
}

function parseGeo(str) {
  const coords = str.replace("geo:", "").split(",");
  return [parseFloat(coords[0]), parseFloat(coords[1])];
}

fetch("location-history.json")
  .then(res => res.json())
  .then(data => {

    data.forEach(entry => {

  let latLng = null;

  // VISITS
  if (entry.visit && entry.visit.topCandidate?.placeLocation) {
    latLng = parseGeo(entry.visit.topCandidate.placeLocation);
  }

  // ACTIVITIES (treat start location as stop)
  if (!latLng && entry.activity && entry.activity.start) {
    latLng = parseGeo(entry.activity.start);
  }

  if (!latLng) return;

  const durationMs = new Date(entry.endTime) - new Date(entry.startTime);
  const durationSeconds = durationMs / 1000;

  // Only include stops longer than 10 seconds
  if (durationSeconds < 10) return;

  const date = new Date(entry.startTime);
  const dayKey = date.toISOString().split("T")[0];

  if (!stopsByDay[dayKey]) {
    stopsByDay[dayKey] = [];
  }

  stopsByDay[dayKey].push({
    latLng,
    start: entry.startTime,
    end: entry.endTime,
    durationSeconds
  });

});

      let latLng = null;

      if (entry.visit && entry.visit.topCandidate?.placeLocation) {
        latLng = parseGeo(entry.visit.topCandidate.placeLocation);
      }

      if (!latLng) return;

      const date = new Date(entry.startTime);
      const dayKey = date.toISOString().split("T")[0];

      if (!stopsByDay[dayKey]) {
        stopsByDay[dayKey] = [];
      }

      stopsByDay[dayKey].push({
        latLng,
        start: entry.startTime,
        end: entry.endTime
      });

    });

    const select = document.getElementById("daySelect");

    Object.keys(stopsByDay).sort().forEach(day => {
      const option = document.createElement("option");
      option.value = day;
      option.textContent = day;
      select.appendChild(option);
    });

    select.addEventListener("change", () => {
      loadDay(select.value);
    });

    if (select.options.length > 0) {
      loadDay(select.options[0].value);
    }

  });

function loadDay(day) {
  currentStops = stopsByDay[day] || [];
  currentIndex = 0;

  if (currentStops.length > 0) {
    showStop();
  } else {
    document.getElementById("info").textContent = "No stops for this day.";
  }
}

function showStop() {
  const stop = currentStops[currentIndex];

  if (!stop) return;

  if (marker) map.removeLayer(marker);

  marker = L.marker(stop.latLng).addTo(map);
  map.setView(stop.latLng, 13);

  document.getElementById("info").innerHTML = `
    <strong>Arrival:</strong> ${formatTime(stop.start)}<br>
    <strong>Departure:</strong> ${formatTime(stop.end)}<br>
    <strong>Duration:</strong> ${formatDuration(stop.start, stop.end)}
  `;
}

function nextStop() {
  if (currentIndex < currentStops.length - 1) {
    currentIndex++;
    showStop();
  }
}

function prevStop() {
  if (currentIndex > 0) {
    currentIndex--;
    showStop();
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FULL GPS MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map',{maxZoom:22}).setView([52.8599,-104.6010],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:22
}).addTo(map);

// 🔥 LOAD YOUR FULL DATA FILE DIRECTLY
fetch('text.txt')
.then(res => res.text())
.then(raw => {

  let regex = /Latitude:\s*(-?\d+\.\d+)\s*Longitude:\s*(-?\d+\.\d+)/g;

  let match;
  let count = 0;
  let bounds = [];

  while((match = regex.exec(raw)) !== null){

    let lat = parseFloat(match[1]);
    let lng = parseFloat(match[2]);

    let marker = L.circleMarker([lat,lng],{
      radius:6,
      color:"#0066ff",
      fillColor:"#3399ff",
      fillOpacity:0.9
    }).addTo(map);

    marker.bindPopup("Stop " + (++count));

    bounds.push([lat,lng]);
  }

  if(bounds.length > 0){
    map.fitBounds(bounds);
  } else {
    alert("No data found in file");
  }

})
.catch(err=>{
  alert("Could not load data file");
  console.error(err);
});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Playback</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#controls { padding:10px; background:#f4f4f4; }
#map { height:40vh; }
</style>

</head>

<body>

<div id="controls">
<label>Day:</label>
<select id="daySelect"></select>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<label>Speed</label>
<input type="range" id="speed" min="1" max="20" value="5">
</div>

<div id="map"></div>
<div id="timeline" style="height:200px; overflow:auto; background:#ffffff; border-top:1px solid #ccc; font-family:Arial; font-size:14px; padding:10px;"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([53.2,-105.7],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map);

let routeLayer = L.layerGroup().addTo(map);
let marker = null;
let currentPoints = [];
let index = 0;
let timer = null;

async function loadTimeline(){

const response = await fetch("location_history_raw_dump.csv");
const text = await response.text();

let points = [];

text.split("\n").forEach(line => {

let geo = line.match(/geo:([0-9.-]+),([0-9.-]+)/);
let time = line.match(/startTime': '([^']+)/);

if(geo && time){

points.push({
lat:parseFloat(geo[1]),
lng:parseFloat(geo[2]),
time:new Date(time[1])
});

}

});

buildDays(points);

}

function buildDays(points){

let days = {};

points.forEach(p => {

let day = p.time.toISOString().slice(0,10);

if(!days[day]) days[day] = [];

days[day].push(p);

});

let select = document.getElementById("daySelect");

Object.keys(days).sort().forEach(day => {

let opt = document.createElement("option");
opt.value = day;
opt.text = day;

select.appendChild(opt);

});

select.addEventListener("change", () => loadDay(days[select.value]));

loadDay(days[Object.keys(days)[0]]);

}

function loadDay(points){

routeLayer.clearLayers();

currentPoints = points;
index = 0;

let latlngs = points.map(p => [p.lat,p.lng]);

let route = L.polyline(latlngs,{color:"blue"}).addTo(routeLayer);

let start = latlngs[0];
let end = latlngs[latlngs.length-1];

L.marker(start).addTo(routeLayer).bindPopup("Start of Day");
L.marker(end).addTo(routeLayer).bindPopup("End of Day");

marker = L.circleMarker(start,{
radius:6,
color:"red"
}).addTo(routeLayer);

map.fitBounds(route.getBounds());

buildTimeline(points);

}

function buildTimeline(points){

let timeline = document.getElementById("timeline");

if(!timeline) return;

timeline.innerHTML = "";

points.forEach((p,i) => {

let row = document.createElement("div");

row.innerText = p.time.toLocaleTimeString();

row.style.cursor="pointer";
row.style.padding="4px";

row.onclick = () => jumpTo(i);

timeline.appendChild(row);

});

}

function jumpTo(i){

let p = currentPoints[i];

marker.setLatLng([p.lat,p.lng]);

map.setView([p.lat,p.lng],14);

L.circleMarker([p.lat,p.lng],{
radius:4,
color:"orange"
}).addTo(routeLayer);

}

function play(){

clearInterval(timer);

timer = setInterval(()=>{

if(index>=currentPoints.length) return;

let p = currentPoints[index];

marker.setLatLng([p.lat,p.lng]);

index++;

},1000);

}

function pause(){

clearInterval(timer);

}

loadTimeline();

</script>

</body>
</html>

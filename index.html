<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>GPS Playback</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#controls { padding:10px; background:#f4f4f4; }
#map { height:75vh; }
</style>

</head>

<body>

<div id="controls">
<label>Day:</label>
<select id="daySelect"></select>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<label>Speed</label>
<input type="range" id="speed" min="1" max="20" value="5">
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let data = {
  month:"January 2026",
  days:{
    "2026-01-01":[
      {lat:53.212,lng:-105.743,time:"08:00"},
      {lat:53.230,lng:-105.700,time:"08:10"},
      {lat:53.250,lng:-105.640,time:"08:25"},
      {lat:53.290,lng:-105.580,time:"08:40"},
      {lat:53.320,lng:-105.520,time:"09:00"}
    ]
  }
};

let map = L.map('map').setView([53.2,-105.7],6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map);

let marker = null;
let polyline = null;
let currentIndex = 0;
let timer = null;

let daySelect = document.getElementById("daySelect");

for(let day in data.days){
 let option=document.createElement("option");
 option.value=day;
 option.text=day;
 daySelect.appendChild(option);
}

function loadDay(day){

let points=data.days[day];

if(marker) map.removeLayer(marker);
if(polyline) map.removeLayer(polyline);

let latlngs=points.map(p=>[p.lat,p.lng]);

polyline=L.polyline([], {color:'blue'}).addTo(map);

marker=L.circleMarker(latlngs[0],{radius:6,color:'red'}).addTo(map);

map.fitBounds(latlngs);

currentIndex=0;
window.currentPoints=points;

}

function play(){

let speed=document.getElementById("speed").value;

clearInterval(timer);

timer=setInterval(()=>{

if(currentIndex>=window.currentPoints.length) return;

let p=window.currentPoints[currentIndex];

polyline.addLatLng([p.lat,p.lng]);
marker.setLatLng([p.lat,p.lng]);

currentIndex++;

},1000/speed);

}

function pause(){
clearInterval(timer);
}

daySelect.addEventListener("change",function(){
loadDay(this.value);
});
async function loadData(){

const response = await fetch("location_history_raw_dump.csv");
const text = await response.text();

let lines = text.split("\n");
let coords = [];

lines.forEach(line => {

let match = line.match(/geo:([0-9.-]+),([0-9.-]+)/);

if(match){
coords.push([parseFloat(match[1]),parseFloat(match[2])]);
}

});

window.coords = coords;
startPlayback();

}
loadDay(daySelect.value);

</script>

</body>
</html>

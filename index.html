<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Playback</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
}

#map{
height:100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([53,-105],6)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map)

let routeLayer = L.layerGroup().addTo(map)

function clearMap(){
routeLayer.clearLayers()
}

function addPoint(lat, lng, time, type){

let marker = L.circleMarker([lat, lng], {
radius: type === "visit" ? 6 : 3,
color: type === "visit" ? "orange" : "#00ffff"
}).addTo(routeLayer)

marker.bindPopup(
type + "<br>" + new Date(time).toLocaleString()
)

return [lat, lng]
}

function loadData(data){

clearMap()

let points = []

data.forEach(item => {

if(item.activity){

let start = item.activity.start.replace("geo:","").split(",")
let end = item.activity.end.replace("geo:","").split(",")

points.push(addPoint(start[0], start[1], item.startTime, "move"))
points.push(addPoint(end[0], end[1], item.endTime, "move"))

}

if(item.visit){

let loc = item.visit.topCandidate.placeLocation
.replace("geo:","")
.split(",")

points.push(addPoint(loc[0], loc[1], item.startTime, "visit"))

}

})

if(points.length > 1){
let line = L.polyline(points, {color:"blue"}).addTo(routeLayer)
map.fitBounds(line.getBounds())
}

}

fetch("location-history.json")
.then(res => res.json())
.then(data => {
loadData(data)
})

</script>

</body>
</html>
